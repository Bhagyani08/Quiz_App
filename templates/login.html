
<!DOCTYPE html>
<html>
<head>
    <title>Start Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">

    <button id="installBtn" style="display:none; position:fixed; bottom:20px; right:20px; padding:12px 16px; background:#2563eb; color:white; border:none; border-radius:8px; cursor:pointer; z-index:9999;">
      Install App
    </button>
    
    <script>
      let deferredPrompt;
      const installBtn = document.getElementById("installBtn");
    
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = "block";
      });
    
      installBtn.addEventListener("click", async () => {
        installBtn.style.display = "none";
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
      });
    </script>

</head>

<body class="bg-light">

<div class="container d-flex justify-content-center mt-5">
    <div class="card shadow p-4" style="width: 450px;">

        <h2 class="text-primary mb-3">Start Quiz</h2>

        <form method="POST">

            <label class="fw-bold">Your Name</label>
            <input type="text" class="form-control mb-3" name="name" required>

            <label class="fw-bold">Email</label>
            <input type="email" class="form-control mb-4" name="email" required>

            <button type="submit" class="btn btn-primary w-100">Start Quiz</button>
        </form>

        <hr class="my-4">

        <p class="text-muted small">
            Your answers will be saved securely for your session.
        </p>

    </div>
</div>

</body>
</html>
